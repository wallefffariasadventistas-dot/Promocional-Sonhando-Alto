<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Sonhando Alto</title>
<meta name="robots" content="noindex, nofollow" />
<link
  href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-login">
    <div class="admin-login__card">
      <p class="admin-login__eyebrow">Sonhando Alto</p>
      <h1>Área do administrador</h1>
      <p class="admin-login__hint">Acesso restrito à equipe do projeto.</p>

      <form id="login-form">
        <div class="field">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="login-btn">Entrar</button>
        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script src="/js/admin-login.js"></script>
</body>
</html>
