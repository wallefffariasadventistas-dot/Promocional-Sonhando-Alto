<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Sonhando Alto</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/images/icons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/images/icons/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/images/icons/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0c1a3a" />
<link
  href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/admin.css" />
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="admin-body">
  <!--
    Login e painel vivem na MESMA página (sem window.location.href entre
    eles): alternar de view aqui dentro evita a navegação de página logo
    após o Firebase confirmar o login do Google, que em alguns navegadores
    (Safari/iOS com proteções de privacidade) corria mais rápido que a
    sessão ser persistida, fazendo o usuário "voltar" para a tela de login.
  -->
  <div id="login-view" class="admin-login">
    <div class="admin-login__card">
      <p class="admin-login__eyebrow">Sonhando Alto</p>
      <h1>Área do administrador</h1>
      <p class="admin-login__hint">Entre com sua conta de e-mail Google.</p>

      <button type="button" class="btn btn--primary btn--block" id="login-btn">
        Entrar com Google
      </button>
      <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
    </div>
  </div>

  <div id="dashboard-view" class="admin-dashboard" hidden>
    <header class="admin-header">
      <div class="admin-header__inner">
        <h1>Leads — Sonhando Alto</h1>
        <div class="admin-header__actions">
          <button class="btn btn--ghost btn--small" id="export-xlsx-btn">Baixar Excel</button>
          <button class="btn btn--ghost btn--small" id="export-pdf-btn">Baixar PDF</button>
          <button class="btn btn--ghost btn--small" id="logout-btn">Sair</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-tabs">
        <button type="button" class="admin-tab is-active" id="tab-leads-btn" data-view="leads">
          Leads
        </button>
        <button type="button" class="admin-tab" id="tab-contacted-btn" data-view="contactados">
          Contactados
        </button>
      </div>

      <div class="admin-toolbar">
        <input type="search" id="search-input" placeholder="Buscar por nome, cidade, curso..." />
        <span id="total-count" class="admin-toolbar__count"></span>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Idade</th>
              <th>Curso de interesse</th>
              <th>Cidade</th>
              <th>Distrito</th>
              <th>Cadastro</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="leads-tbody">
            <tr>
              <td colspan="8" class="admin-table__empty">Carregando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/firebase-config.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
