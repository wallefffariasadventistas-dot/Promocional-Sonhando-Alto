<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leads — Sonhando Alto</title>
<meta name="robots" content="noindex, nofollow" />
<link
  href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="admin-header__inner">
      <h1>Leads — Sonhando Alto</h1>
      <div class="admin-header__actions">
        <a class="btn btn--ghost btn--small" href="/api/admin/export-xlsx">Baixar Excel</a>
        <a class="btn btn--ghost btn--small" href="/api/admin/export-pdf">Baixar PDF</a>
        <button class="btn btn--ghost btn--small" id="logout-btn">Sair</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-toolbar">
      <input type="search" id="search-input" placeholder="Buscar por nome, cidade, curso..." />
      <span id="total-count" class="admin-toolbar__count"></span>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Idade</th>
            <th>Curso de interesse</th>
            <th>Cidade</th>
            <th>Distrito</th>
            <th>Cadastro</th>
          </tr>
        </thead>
        <tbody id="leads-tbody">
          <tr>
            <td colspan="7" class="admin-table__empty">Carregando...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
